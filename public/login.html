<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 · 智波助梦</title>
  <!--
    此页为「自包含静态页」：样式与脚本全部内联，由 public/ 静态目录直接提供。
    注册与登录通过同源 /api 接口访问后端。
  -->
  <style>
    html, body { margin: 0; height: 100%; font-family: Arial, 'Microsoft YaHei', sans-serif; }
    body { background: linear-gradient(135deg, #1b2a3a 0%, #2c3e50 60%, #22303f 100%);
           display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { width: 380px; max-width: 92vw; background: #fff; border-radius: 10px;
            box-shadow: 0 12px 32px rgba(0,0,0,.35); overflow: hidden; }
    .brand { background: #2c3e50; color: #fff; text-align: center; padding: 22px 16px 18px; }
    .brand h1 { margin: 0; font-size: 22px; letter-spacing: 2px; }
    .brand p { margin: 6px 0 0; font-size: 12px; color: #9fb3c8; }
    .tabs { display: flex; border-bottom: 1px solid #eee; }
    .tabs button { flex: 1; padding: 12px 0; border: 0; background: none; cursor: pointer;
                   font-size: 15px; color: #7f8c9b; }
    .tabs button.active { color: #2196F3; font-weight: bold; border-bottom: 2px solid #2196F3; }
    .body { padding: 22px 24px 8px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: #34495e; margin-bottom: 6px; }
    .field input { width: 100%; box-sizing: border-box; padding: 10px 12px;
                   border: 1px solid #dfe6ec; border-radius: 6px; font-size: 14px; outline: none; }
    .field input:focus { border-color: #2196F3; }
    .btn { width: 100%; padding: 11px 0; border: 0; border-radius: 6px; cursor: pointer;
           background: #2196F3; color: #fff; font-size: 15px; letter-spacing: 1px; }
    .btn:hover { background: #1976d2; }
    .btn:disabled { background: #9cc7ec; cursor: not-allowed; }
    .btn.guest { margin-top: 10px; background: #607d8b; font-size: 14px; }
    .btn.guest:hover { background: #4b5f6b; }
    .tip { font-size: 12.5px; padding: 8px 10px; border-radius: 6px; margin-bottom: 14px; }
    .tip.error { background: #fdecea; color: #c0392b; }
    .tip.ok { background: #e8f5e9; color: #2e7d32; }
    .foot { text-align: center; font-size: 12px; color: #9aa7b4; padding: 4px 24px 18px; }
    .hide { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <h1>智波助梦</h1>
      <p>示波器仿真系统</p>
    </div>
    <div class="tabs">
      <button id="tab-login" class="active" onclick="switchTab('login')">登录</button>
      <button id="tab-register" onclick="switchTab('register')">注册</button>
    </div>
    <div class="body">
      <div id="msg" class="tip hide"></div>

      <div id="pane-login">
        <div class="field"><label>用户名</label><input id="l-user" placeholder="请输入用户名" /></div>
        <div class="field"><label>密码</label><input id="l-pass" type="password" placeholder="请输入密码" /></div>
        <button class="btn" id="btn-login" onclick="onLogin()">登 录</button>
        <button class="btn guest" id="btn-guest" onclick="onGuest()">免登录体验（游客模式）</button>
      </div>

      <div id="pane-register" class="hide">
        <div class="field"><label>用户名</label><input id="r-user" maxlength="20" placeholder="3–20 位中文、字母、数字、_ 或 -" /></div>
        <div class="field"><label>昵称（可选）</label><input id="r-nick" maxlength="40" placeholder="显示名称" /></div>
        <div class="field"><label>密码</label><input id="r-pass" type="password" placeholder="8–128 位" /></div>
        <div class="field"><label>确认密码</label><input id="r-confirm" type="password" placeholder="再次输入密码" /></div>
        <button class="btn" id="btn-register" onclick="onRegister()">注 册</button>
      </div>
    </div>
    <div class="foot">账号与实验记录保存至服务器，重新登录后可恢复</div>
  </div>

  <script>
    var API_BASE = '/api';

    // localStorage 键名（与后续 Vue 应用保持一致）
    var TOKEN_KEY = 'sbq_token';
    var USER_KEY = 'sbq_user';

    function $(id) { return document.getElementById(id); }

    function showMsg(text, type) {
      var el = $('msg');
      el.textContent = text;
      el.className = 'tip ' + type;
    }
    function clearMsg() { $('msg').className = 'tip hide'; }

    function switchTab(tab) {
      clearMsg();
      var isLogin = tab === 'login';
      $('tab-login').className = isLogin ? 'active' : '';
      $('tab-register').className = isLogin ? '' : 'active';
      $('pane-login').className = isLogin ? '' : 'hide';
      $('pane-register').className = isLogin ? 'hide' : '';
    }

    // ===== 存储降级层 =====
    // 鸿蒙 ArkWeb 等宿主可能关闭 DOM Storage，直接调用 localStorage 会抛 SecurityError，
    // 导致 saveSession() 中断、"点登录毫无反应"。这里按 localStorage → sessionStorage → 内存
    // 依次降级，保证登录流程永不中断。
    var memStore = {};
    var storage = (function () {
      function probe(factory) {
        try {
          var s = factory();
          if (!s) return null;
          s.setItem('__sbq_probe__', '1');
          s.removeItem('__sbq_probe__');
          return s;
        } catch (e) { return null; }
      }
      var layers = [
        probe(function () { return typeof localStorage !== 'undefined' ? localStorage : null; }),
        probe(function () { return typeof sessionStorage !== 'undefined' ? sessionStorage : null; })
      ].filter(Boolean);

      return {
        persistent: layers.length > 0,
        getItem: function (k) {
          for (var i = 0; i < layers.length; i++) {
            try { var v = layers[i].getItem(k); if (v !== null && v !== undefined) return v; } catch (e) {}
          }
          return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null;
        },
        setItem: function (k, v) {
          memStore[k] = String(v);
          for (var i = 0; i < layers.length; i++) { try { layers[i].setItem(k, String(v)); } catch (e) {} }
        },
        removeItem: function (k) {
          delete memStore[k];
          for (var i = 0; i < layers.length; i++) { try { layers[i].removeItem(k); } catch (e) {} }
        }
      };
    })();

    function saveSession(token, user) {
      storage.setItem(TOKEN_KEY, token);
      storage.setItem(USER_KEY, JSON.stringify(user));
      return { token: token, user: user };
    }

    // 存储不可持久化时，把登录态通过 URL 传给下一页，
    // 否则跳转后新文档读不到 token，会被守卫再次弹回登录页（死循环）。
    function buildRedirectUrl(session) {
      var url = './index.html';
      if (!storage.persistent) {
        url += '?sbq_token=' + encodeURIComponent(session.token) +
               '&sbq_user=' + encodeURIComponent(JSON.stringify(session.user));
      }
      return url;
    }
    // Registration never writes passwords into browser storage.
    async function request(path, data) {
      if (!/^https?:$/.test(location.protocol)) throw new Error('请打开后端网页地址使用账号功能，或选择游客体验');
      if (!storage.persistent) throw new Error('请允许浏览器保存登录状态后再登录，或选择游客体验');
      var controller = new AbortController();
      var timer = setTimeout(function () { controller.abort(); }, 10000);
      try {
        var res = await fetch(API_BASE + path, {
          method: 'POST', signal: controller.signal,
          headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
        });
        var result = await res.json().catch(function () { throw new Error('后端尚未启动，请启动服务后重试'); });
        if (!res.ok) throw new Error(result.message || '请求失败');
        return result;
      } catch (e) {
        if (e.name === 'AbortError') throw new Error('请求超时，请稍后重试；注册超时可先尝试登录');
        if (e instanceof TypeError) throw new Error('无法连接后端，请检查服务是否已启动');
        throw e;
      } finally { clearTimeout(timer); }
    }
    function login(username, password) {
      return request('/auth/login', { username: username, password: password })
        .then(function (d) { return saveSession(d.token, d.user); });
    }
    function register(username, password, nickname) {
      return request('/auth/register', { username: username, password: password, nickname: nickname });
    }

    function onLogin() {
      clearMsg();
      var u = $('l-user').value.trim(), p = $('l-pass').value;
      if (!u || !p) return showMsg('请输入用户名和密码', 'error');
      $('btn-login').disabled = true;
      login(u, p)
        .then(function (session) {
          showMsg('登录成功，正在进入系统...', 'ok');
          var target = buildRedirectUrl(session);
          setTimeout(function () { window.location.href = target; }, 600);
        })
        .catch(function (e) { showMsg(e.message || '登录失败', 'error'); })
        .then(function () { $('btn-login').disabled = false; });
    }

    function onRegister() {
      clearMsg();
      var u = $('r-user').value.trim(), n = $('r-nick').value.trim(),
          p = $('r-pass').value, c = $('r-confirm').value;
      if (!u || !p) return showMsg('请填写用户名和密码', 'error');
      if (u.length < 3 || u.length > 20) return showMsg('用户名长度需为 3-20 位', 'error');
      if (p.length < 8 || p.length > 128) return showMsg('密码需为 8–128 位', 'error');
      if (p !== c) return showMsg('两次输入的密码不一致', 'error');
      $('btn-register').disabled = true;
      register(u, p, n)
        .then(function () {
          $('l-user').value = u; $('l-pass').value = '';
          $('r-user').value = ''; $('r-nick').value = '';
          $('r-pass').value = ''; $('r-confirm').value = '';
          switchTab('login');
          showMsg('注册成功，请登录', 'ok');
        })
        .catch(function (e) { showMsg(e.message || '注册失败', 'error'); })
        .then(function () { $('btn-register').disabled = false; });
    }

    // 游客模式：不注册、不落库，直接进入系统。
    // 用途：演示场景 / 鸿蒙设备首次体验 / 宿主禁用存储时的兜底入口。
    function onGuest() {
      clearMsg();
      var guest = {
        id: 0, username: 'guest', nickname: '游客',
        createdAt: new Date().toISOString()
      };
      var session = saveSession('guest-token', guest);
      showMsg('已进入游客模式，正在打开系统...', 'ok');
      setTimeout(function () { window.location.href = buildRedirectUrl(session); }, 400);
    }

    // 回车提交
    document.addEventListener('DOMContentLoaded', function () {
      $('l-user').addEventListener('keyup', function (e) { if (e.key === 'Enter') onLogin(); });
      $('l-pass').addEventListener('keyup', function (e) { if (e.key === 'Enter') onLogin(); });
      $('r-confirm').addEventListener('keyup', function (e) { if (e.key === 'Enter') onRegister(); });

      // 宿主禁用持久化存储时给出明确提示（否则用户会以为"登录没反应"）
      if (!storage.persistent) {
        showMsg('当前运行环境不支持保存登录状态，登录后刷新页面需重新登录；也可直接用游客模式体验。', 'error');
      }
    });
  </script>
</body>
</html>
